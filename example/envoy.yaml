---
static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.open_telemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.open_telemetry.v3.OpenTelemetryAccessLogConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otel_collector
                      resource_attributes:
                        values:
                          - key: service.name
                            value:
                              string_value: coraza-envoy-waf
                      attributes:
                        values:
                          - key: http.status_code
                            value:
                              string_value: "%RESPONSE_CODE%"
                          - key: http.response_flags
                            value:
                              string_value: "%RESPONSE_FLAGS%"
                          - key: http.method
                            value:
                              string_value: "%REQ(:METHOD)%"
                          - key: http.path
                            value:
                              string_value: "%REQ(:PATH)%"
                          - key: http.request_id
                            value:
                              string_value: "%REQ(X-REQUEST-ID)%"
                          - key: waf.action
                            value:
                              string_value: "%DYNAMIC_METADATA(coraza-waf:action)%"
                          - key: waf.rule_id
                            value:
                              string_value: "%DYNAMIC_METADATA(coraza-waf:rule_id)%"
                          - key: waf.message
                            value:
                              string_value: "%DYNAMIC_METADATA(coraza-waf:message)%"
                          - key: waf.status
                            value:
                              string_value: "%DYNAMIC_METADATA(coraza-waf:status)%"
                          - key: waf.phase
                            value:
                              string_value: "%DYNAMIC_METADATA(coraza-waf:phase)%"
                http_filters:
                  - name: envoy.filters.http.golang
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.golang.v3alpha.Config
                      library_id: coraza-waf
                      library_path: /build/coraza-waf.so
                      plugin_name: coraza-waf
                      plugin_config:
                          "@type": type.googleapis.com/xds.type.v3.TypedStruct
                          value:
                              directives:
                                waf1:
                                  simple_directives:
                                    - "Include @coraza-setup"
                                    - "Include @crs-setup"
                                    - "SecDebugLogLevel 3"
                                    - "Include @owasp_crs/*.conf"
                                    - "SecRule REQUEST_URI \"@streq /admin\" \"id:101,phase:1,t:lowercase,deny\""
                                    - "SecRule REQUEST_BODY \"@rx maliciouspayload\" \"id:102,phase:2,t:lowercase,deny\""
                                    - "SecRule RESPONSE_HEADERS::status \"@rx 406\" \"id:103,phase:3,t:lowercase,deny\""
                                    - "SecRule RESPONSE_BODY \"@contains responsebodycode\" \"id:104,phase:4,t:lowercase,deny\""
                                waf2:
                                  simple_directives:
                                    - "Include @coraza-setup"
                                    - "Include @crs-setup"
                                    - "SecDebugLogLevel 3"
                                    - "Include @owasp_crs/*.conf"
                                    - "SecRule REQUEST_URI \"@streq /example\" \"id:101,phase:1,t:lowercase,deny\""
                                    - "SecRule REQUEST_BODY \"@rx maliciouspayload\" \"id:102,phase:2,t:lowercase,deny\""
                                    - "SecRule RESPONSE_HEADERS::status \"@rx 406\" \"id:103,phase:3,t:lowercase,deny\""
                                    - "SecRule RESPONSE_BODY \"@contains responsebodycode\" \"id:104,phase:4,t:lowercase,deny\""
                              default_directive: "waf1"
                              host_directive_map:
                                "foo.example.com": "waf1"
                                "bar.example.com": "waf2"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            host_rewrite_literal: 0.0.0.0:8080
                            cluster: service_gin

  clusters:
    - name: otel_collector
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: otelcol
                      port_value: 4317
    - name: service_gin
      type: LOGICAL_DNS
      # Comment out the following line to test on v6 networks
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: service_gin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend
                      port_value: 8080
admin:
  access_log_path: /dev/null
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9999
